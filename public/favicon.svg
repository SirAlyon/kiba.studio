<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e06666" />
      <stop offset="100%" stop-color="#c94c4c" />
    </linearGradient>
  </defs>

  <!-- Sfondo: cerchio scuro per visibilità su tab sia chiari che scuri -->
  <circle cx="50" cy="50" r="50" fill="#1a1a1a" />

  <!-- Forme essenziali Akita: orecchie + testa a scudo (no dettagli interni) -->
  <!-- Orecchio sinistro -->
  <path d="M28 38 L20 22 L36 28 Z" fill="url(#brand)" />
  <!-- Orecchio destro -->
  <path d="M72 38 L80 22 L64 28 Z" fill="url(#brand)" />
  <!-- Testa a scudo -->
  <path d="M50 22 L26 38 V64 L50 84 L74 64 V38 L50 22 Z" fill="url(#brand)" />
  <!-- Maschera facciale (richiamo Akita, contrasto chiaro) -->
